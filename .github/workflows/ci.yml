name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: little_genius
          POSTGRES_PASSWORD: little_genius
          POSTGRES_DB: little_genius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U little_genius -d little_genius_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npx prettier --check ../content_admin
      - run: npm run openapi:check
      - run: npm test
      - name: Content admin
        working-directory: services/content_admin
        run: node --experimental-strip-types --test test/*.test.ts
      - name: Secret scan
        working-directory: .
        run: node scripts/scan-secrets.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/web/indexeddb_repository_test.dart
      - run: flutter build web --release

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f infrastructure/docker/api.Dockerfile .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
