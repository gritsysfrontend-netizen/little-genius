# Local development only. Postgres is bound to localhost. There is no Redis service.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: little_genius
      POSTGRES_PASSWORD: little_genius
      POSTGRES_DB: little_genius
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U little_genius -d little_genius"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://little_genius:little_genius@postgres:5432/little_genius
      ASSET_SIGNING_KEY: local-dev-only-not-a-secret
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
